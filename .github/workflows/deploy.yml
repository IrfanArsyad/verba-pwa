name: CI-CD Auto Deploy to Homelab

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy on Self-Hosted Runner
    runs-on: self-hosted

    steps:
      - name: Sync ke commit pemicu
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/fanz/Projects/studiolab/verba-pwa' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "Failed at line $LINENO: $BASH_COMMAND" >&2' ERR

          deploy_path="$DEPLOY_PATH"

          case "$deploy_path" in
            "~") deploy_path="$HOME" ;;
            "~/"*) deploy_path="$HOME/${deploy_path#\~/}" ;;
          esac

          if [[ ! -d "$deploy_path/.git" ]]; then
            echo "Not a Git repository: $deploy_path" >&2
            exit 1
          fi

          echo "Deploy path: $deploy_path"
          echo "Runner: $(hostname)"
          echo "Git version: $(git --version)"

          echo "DEPLOY_DIR=$deploy_path" >> "$GITHUB_ENV"
          cd "$deploy_path"

          git fetch --prune origin release
          git cat-file -e "$GITHUB_SHA^{commit}"
          git checkout --force -B release "$GITHUB_SHA"

          echo "Checked out: $(git rev-parse HEAD)"

      - name: Build image & restart stack
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "Deploy failed at line $LINENO: $BASH_COMMAND" >&2' ERR

          cd "$DEPLOY_DIR"

          test -x ./deploy.sh || {
            echo "./deploy.sh is missing or not executable" >&2
            ls -la
            exit 1
          }

          docker --version
          docker compose version
          ./deploy.sh

      - name: Laporkan versi yang jalan
        if: always()
        shell: bash
        run: |
          cd "$DEPLOY_DIR"
          echo "HEAD: $(git rev-parse --short HEAD) ($(git log -1 --format=%s))"
          docker compose ps || true
