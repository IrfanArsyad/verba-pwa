# Deploy otomatis saat ada push ke branch release.
#
# Berjalan di self-hosted runner yang terpasang di server itu sendiri, jadi
# tidak ada koneksi masuk dari internet dan tidak butuh secret SSH.
#
# Path repo bisa diatur lewat repository variable DEPLOY_PATH
# (default: /home/fanz/Projects/studiolab/verba-pwa).

name: Deploy

on:
  push:
    branches: [release]
  workflow_dispatch:

# Satu deploy dalam satu waktu. Deploy tidak dibatalkan di tengah jalan supaya
# stack docker tidak ditinggal dalam keadaan setengah jadi.
concurrency:
  group: deploy-release
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & restart stack
    runs-on: self-hosted
    timeout-minutes: 15

    # Sengaja tanpa actions/checkout: deploy dijalankan di checkout yang sudah
    # ada di server, bukan di workspace runner. Workspace runner tidak punya
    # deploy/cloudflared/credentials.json (untracked) dan stack docker yang
    # sedang jalan terikat ke direktori tersebut.
    steps:
      - name: Sync ke commit pemicu
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/fanz/Projects/studiolab/verba-pwa' }}
        run: |
          deploy_path="$DEPLOY_PATH"

          # `~` tidak diekspansi saat path datang dari variabel, jadi lakukan manual.
          case "$deploy_path" in
            "~")   deploy_path="$HOME" ;;
            "~/"*) deploy_path="$HOME/${deploy_path#\~/}" ;;
          esac

          if [[ ! -d "$deploy_path/.git" ]]; then
            echo "Tidak ada repo git di $deploy_path" >&2
            exit 1
          fi
          echo "DEPLOY_DIR=$deploy_path" >> "$GITHUB_ENV"
          cd "$deploy_path"

          git fetch --prune origin release
          # Reset ke SHA persis yang memicu workflow, bukan ke origin/release,
          # supaya push beruntun tidak saling mendahului.
          # -f wajib: tanpa itu checkout batal kalau ada file terlacak yang
          # pernah diedit manual di server. File untracked tidak ikut terhapus.
          git checkout -f -B release "$GITHUB_SHA"
          # Sengaja tanpa `git clean`: deploy/cloudflared/credentials.json tidak
          # dilacak git dan akan terhapus kalau working tree dibersihkan.

      - name: Build image & restart stack
        run: |
          cd "$DEPLOY_DIR"
          ./deploy.sh

      - name: Laporkan versi yang jalan
        if: always()
        run: |
          cd "$DEPLOY_DIR"
          echo "HEAD: $(git rev-parse --short HEAD) ($(git log -1 --format=%s))"
          docker compose ps
