# verba.studiolab.id — hanya dijangkau cloudflared lewat jaringan compose,
# plus 127.0.0.1:8130 di host untuk diagnosa.

set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Cloudflare mengisi X-Forwarded-Proto dengan skema asli pengunjung. Kalau
  # "http", pindahkan ke https. Akses diagnosa lokal (tanpa header) tidak kena.
  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Service worker dan manifest harus selalu diperiksa ulang, kalau tidak
  # browser bisa terjebak memakai versi lama berhari-hari.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
  }
  location = /manifest.json {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
  }
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
