# verba.studiolab.id — hanya dijangkau cloudflared lewat jaringan compose,
# plus 127.0.0.1:8130 di host untuk diagnosa.

# Batasi pemakaian Kokoro: sintesis suara memakan CPU dan jalurnya publik.
limit_req_zone $binary_remote_addr zone=kokoro:10m rate=20r/m;

set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;


server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Cloudflare mengisi X-Forwarded-Proto dengan skema asli pengunjung. Kalau
  # "http", pindahkan ke https. Akses diagnosa lokal (tanpa header) tidak kena.
  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Service worker dan manifest harus selalu diperiksa ulang, kalau tidak
  # browser bisa terjebak memakai versi lama berhari-hari.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
  }
  location = /manifest.json {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
  }
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }
  location /js/ {
    add_header Cache-Control "no-cache" always;
  }

  # Kokoro TTS di jaringan compose yang sama. Dipakai aplikasi lewat
  # https://<host>/kokoro/v1/audio/speech, jadi tidak perlu domain terpisah
  # dan tidak kena aturan CORS.
  location /kokoro/ {
    limit_req zone=kokoro burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://kokoro:8880/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Sintesis suara di CPU bisa lama untuk teks panjang.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_buffering off;
    client_max_body_size 2m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
